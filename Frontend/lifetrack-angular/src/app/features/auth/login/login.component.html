<!-- login.component.html -->
<div style="min-height:100vh; background:var(--page-bg); display:flex; align-items:center; justify-content:center; padding:24px;">
  <div style="width:100%; max-width:400px;">

    <!-- Logo -->
    <div style="text-align:center; margin-bottom:28px;">
      <div style="font-size:28px; font-weight:700; color:var(--navy);">
        Life<span style="color:#2563EB;">Track</span>
      </div>
      <div style="font-size:13px; color:var(--text-secondary); margin-top:5px;">
        Clinical Trials & Patient Engagement Platform
      </div>
    </div>

    <div class="lt-card">
      <div style="padding:24px 24px 0;">
        <div style="font-size:18px; font-weight:600; color:var(--text-heading); margin-bottom:4px;">
          Sign in to your account
        </div>
        <div style="font-size:13px; color:var(--text-secondary); margin-bottom:22px;">
          Use your LifeTrack credentials to continue.
        </div>

        <div class="lt-alert lt-alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

        <form (ngSubmit)="onSubmit()">
          <div class="lt-form-group">
            <label class="lt-form-label">Email address</label>
            <input class="lt-form-control" type="email"
                   [(ngModel)]="email" name="email"
                   placeholder="you@lifetrack.io" />
          </div>
          <div class="lt-form-group" style="margin-bottom:20px;">
            <label class="lt-form-label">Password</label>
            <input class="lt-form-control" type="password"
                   [(ngModel)]="password" name="password"
                   placeholder="••••••••" />
          </div>
          <button type="submit" class="lt-btn lt-btn-primary"
                  style="width:100%; justify-content:center; padding:11px;"
                  [disabled]="isLoading">
            <span class="lt-spinner" style="width:14px;height:14px;" *ngIf="isLoading"></span>
            <span *ngIf="!isLoading">Sign in</span>
          </button>
        </form>

        <div style="text-align:center; margin:16px 0 0; padding-bottom:24px;">
          <a routerLink="/register"
             style="font-size:13px; color:var(--text-secondary); text-decoration:none;">
            Patient? <span style="color:#2563EB; font-weight:500;">Register here →</span>
          </a>
        </div>
      </div>
    </div>

    <div style="text-align:center; margin-top:16px; font-size:12px; color:var(--text-muted);">
      Cognizant Internship Project · LifeTrack v2.0 Microservices
    </div>

  </div>
</div>
