<!-- register.component.html -->
<div style="min-height:100vh; background:var(--page-bg); display:flex; align-items:center; justify-content:center; padding:24px;">
  <div style="width:100%; max-width:460px;">

    <div style="text-align:center; margin-bottom:24px;">
      <div style="font-size:26px; font-weight:700; color:var(--navy);">
        Life<span style="color:#2563EB;">Track</span>
      </div>
      <div style="font-size:13px; color:var(--text-secondary); margin-top:5px;">
        Patient Registration
      </div>
    </div>

    <div class="lt-card">
      <div style="padding:24px 24px 0;">
        <div style="font-size:18px; font-weight:600; color:var(--text-heading); margin-bottom:4px;">
          Create your account
        </div>
        <div style="font-size:13px; color:var(--text-secondary); margin-bottom:22px;">
          Register as a patient to access your trial information.
        </div>

        <div class="lt-alert lt-alert-success" *ngIf="successMsg">{{ successMsg }}</div>
        <div class="lt-alert lt-alert-error"   *ngIf="errorMessage">{{ errorMessage }}</div>

        <form (ngSubmit)="onSubmit()">
          <div class="lt-form-row">
            <div class="lt-form-group">
              <label class="lt-form-label">Full Name *</label>
              <input class="lt-form-control" type="text"
                     [(ngModel)]="form.name" name="name"
                     placeholder="Your full name"
                     required
                     minlength="2" />
            </div>
            <div class="lt-form-group">
              <label class="lt-form-label">Email *</label>
              <input class="lt-form-control" type="email"
                     [(ngModel)]="form.email" name="email"
                     placeholder="your@email.com"
                     required />
            </div>
          </div>
          <div class="lt-form-row">
            <div class="lt-form-group">
              <label class="lt-form-label">Date of Birth *</label>
              <input class="lt-form-control" type="date"
                     [(ngModel)]="form.dob" name="dob"
                     required />
            </div>
            <div class="lt-form-group">
              <label class="lt-form-label">Contact Number * (10 digits)</label>
              <input class="lt-form-control" type="text"
                     [(ngModel)]="form.contactInfo" name="contactInfo"
                     placeholder="9876543210"
                     maxlength="10"
                     pattern="[0-9]{10}"
                     (keypress)="onlyNumbers($event)"
                     (paste)="onPasteContact($event)"
                     required />
            </div>
          </div>
          <div class="lt-form-row">
            <div class="lt-form-group">
              <label class="lt-form-label">Password *</label>
              <input class="lt-form-control" type="password"
                     [(ngModel)]="form.password" name="password"
                     placeholder="Min 8 characters"
                     required
                     minlength="8" />
              <small style="font-size:11px; color:#888; display:block; margin-top:4px;">
                Must include: uppercase, lowercase, number, special character
              </small>
            </div>
            <div class="lt-form-group">
              <label class="lt-form-label">Confirm Password *</label>
              <input class="lt-form-control" type="password"
                     [(ngModel)]="form.confirmPassword" name="confirmPassword"
                     placeholder="Repeat password"
                     required />
            </div>
          </div>
          <button type="submit" class="lt-btn lt-btn-primary"
                  style="width:100%; justify-content:center; padding:11px; margin-top:4px;"
                  [disabled]="isLoading">
            <span class="lt-spinner" style="width:14px;height:14px;" *ngIf="isLoading"></span>
            <span *ngIf="!isLoading">Create Account</span>
          </button>
        </form>

        <div style="text-align:center; margin:16px 0 0; padding-bottom:24px;">
          <a routerLink="/login"
             style="font-size:13px; color:var(--text-secondary); text-decoration:none;">
            Already have an account? <span style="color:#2563EB; font-weight:500;">Sign in →</span>
          </a>
        </div>
      </div>
    </div>

  </div>
</div>
