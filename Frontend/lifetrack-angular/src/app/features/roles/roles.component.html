<div style="display:flex;min-height:100vh;
            background:#0B1F3A;font-family:sans-serif;">
  <aside style="width:240px;background:#112240;
                border-right:1px solid #1e3a5f;
                padding:24px 0;">
    <div style="padding:0 24px;margin-bottom:32px;">
      <h2 style="color:#fff;font-family:serif;
                 font-size:22px;margin:0;">
        Life<span style="color:#2563EB;">Track</span>
      </h2>
    </div>
    <nav style="padding:0 12px;">
      <a routerLink="/dashboard"
         style="display:block;padding:10px 12px;
                border-radius:8px;color:#94a3b8;
                text-decoration:none;font-size:14px;
                margin-bottom:4px;">🏠 Dashboard</a>
      <a routerLink="/users"
         style="display:block;padding:10px 12px;
                border-radius:8px;color:#94a3b8;
                text-decoration:none;font-size:14px;
                margin-bottom:4px;">👤 Users</a>
      <a routerLink="/roles"
         style="display:block;padding:10px 12px;
                border-radius:8px;color:#e2e8f0;
                background:#1e3a5f;
                text-decoration:none;font-size:14px;
                margin-bottom:4px;">🔑 Roles</a>
    </nav>
  </aside>

  <main style="flex:1;padding:32px;">
    <h1 style="color:#fff;font-size:24px;
               margin-bottom:24px;">
      Manage Roles
    </h1>

    <div *ngIf="successMsg"
         style="background:#0f2d1f;color:#4ade80;
                border:1px solid #22c55e;padding:12px;
                border-radius:8px;margin-bottom:16px;">
      {{ successMsg }}
    </div>

    <div style="background:#112240;
                border:1px solid #1e3a5f;
                border-radius:12px;padding:24px;
                margin-bottom:24px;">
      <h3 style="color:#fff;margin-bottom:16px;">
        Assign Role to User
      </h3>
      <div style="display:flex;gap:16px;
                  align-items:flex-end;">
        <div style="flex:1;">
          <label style="color:#94a3b8;font-size:12px;
                        display:block;margin-bottom:6px;">
            SELECT USER</label>
          <select [(ngModel)]="selectedUserId"
                  style="width:100%;background:#0b1f3a;
                         border:1px solid #1e3a5f;
                         border-radius:8px;padding:10px;
                         color:#e2e8f0;outline:none;">
            <option value="0">Choose user</option>
            <option *ngFor="let u of users"
                    [value]="u.userID">
              {{ u.name }} ({{ u.roleName }})
            </option>
          </select>
        </div>
        <div style="flex:1;">
          <label style="color:#94a3b8;font-size:12px;
                        display:block;margin-bottom:6px;">
            SELECT ROLE</label>
          <select [(ngModel)]="selectedRoleID"
                  style="width:100%;background:#0b1f3a;
                         border:1px solid #1e3a5f;
                         border-radius:8px;padding:10px;
                         color:#e2e8f0;outline:none;">
            <option value="0">Choose role</option>
            <option *ngFor="let r of roles"
                    [value]="r.roleID">
              {{ r.roleName }}
            </option>
          </select>
        </div>
        <button (click)="assignRole()"
                style="background:#2563EB;color:#fff;
                       border:none;border-radius:8px;
                       padding:10px 24px;cursor:pointer;
                       white-space:nowrap;">
          Assign Role
        </button>
      </div>
    </div>

    <div style="background:#112240;
                border:1px solid #1e3a5f;
                border-radius:12px;overflow:hidden;">
      <table style="width:100%;border-collapse:collapse;">
        <thead>
          <tr style="background:#0b1f3a;">
            <th style="padding:12px 16px;color:#64748b;
                       font-size:12px;text-align:left;">
              NAME</th>
            <th style="padding:12px 16px;color:#64748b;
                       font-size:12px;text-align:left;">
              EMAIL</th>
            <th style="padding:12px 16px;color:#64748b;
                       font-size:12px;text-align:left;">
              CURRENT ROLE</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of users"
              style="border-top:1px solid #1e3a5f;">
            <td style="padding:12px 16px;color:#e2e8f0;
                       font-size:14px;">{{ u.name }}</td>
            <td style="padding:12px 16px;color:#94a3b8;
                       font-size:14px;">{{ u.email }}</td>
            <td style="padding:12px 16px;">
              <span style="background:#1e3a5f;
                           color:#93c5fd;padding:3px 10px;
                           border-radius:20px;font-size:12px;">
                {{ u.roleName }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
